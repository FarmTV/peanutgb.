name: Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install toolchain
        uses: numworks/setup-arm-toolchain@2020-q2
      - name: Run make build
        run: make build
      - name: Upload the .nwa
        uses: actions/upload-artifact@v4
        with:
          name: peanutgb-nwa
          path: output/peanutgb.nwa
